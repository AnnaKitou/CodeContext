[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecontext"
version = "0.1.0"
description = "RAG/MCP system for codebase understanding and developer onboarding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Anna Kitou", email = "kitouanna@gmail.com"}
]
keywords = ["rag", "mcp", "codebase", "ai", "llm", "embeddings"]

dependencies = [
    # FastAPI (standard extras: uvicorn, httpx, python-multipart, etc.)
    "fastapi[standard]>=0.115.0,<1.0.0",

    # Vector DB
    "chromadb>=0.5.0,<1.0.0",

    # Anthropic SDK
    "anthropic>=0.40.0,<1.0.0",

    # LangChain ecosystem
    "langchain-core>=0.1.0,<1.0.0",
    "langchain-huggingface>=0.0.1,<1.0.0",
    "langchain-anthropic>=0.1.0,<1.0.0",
    "langchain-community>=0.0.1,<1.0.0",

    # Embeddings (HuggingFace models for ChromaDB)
    "sentence-transformers>=3.0.0,<6.0.0",

    # Code Analysis — individual per-language packages (tree-sitter >= 0.21 API)
    "tree-sitter>=0.23.0,<1.0.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-ruby>=0.23.0",

    # GitHub API (for MCP tools)
    "PyGithub>=2.1.1,<3.0.0",

    # Frontend
    "gradio>=6.0.0,<7.0.0",

    # Config & validation
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",

    # HTTP client
    "httpx>=0.25.0,<1.0.0",

    # Retry logic (for transient API failures)
    "tenacity>=8.2.3,<9.0.0",

    # Error tracking
    "sentry-sdk[fastapi]>=2.0.0,<3.0.0",

    # Async file I/O
    "aiofiles>=23.2.1,<24.0.0",

    # Structured logging
    "python-json-logger>=2.0.7,<3.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",

    # Type checking (mypy + ty, same as template)
    "mypy>=1.8.0,<2.0.0",
    "ty>=0.0.25",

    # Linting & formatting — ruff replaces black + isort
    "ruff>=0.4.0,<1.0.0",

    # Pre-commit runner
    "prek>=0.2.24,<1.0.0",
]

eval = [
    "pandas>=2.1.3,<3.0.0",
    "numpy>=1.26.2,<2.0.0",
    "scikit-learn>=1.3.2,<2.0.0",
    "matplotlib>=3.8.2,<4.0.0",
]

# ── uv ────────────────────────────────────────────────────────────────────────

[tool.uv]
package = true

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--cov=backend/app --cov-report=html --cov-report=term-missing"

# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["backend/tests", "scripts", "evaluation"]

# ── ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["backend/tests", "scripts", "evaluation", ".venv"]

[tool.ruff.lint]
# Mirrors template: errors, warnings, pyflakes, isort, bugbear,
# comprehensions, pyupgrade, unused args, no print()
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = [
    "E501",  # line-too-long — handled by formatter
    "B008",  # function call in default arg (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── hatch ─────────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]
