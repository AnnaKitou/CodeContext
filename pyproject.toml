[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecontext"
version = "0.1.0"
description = "RAG/MCP system for codebase understanding and developer onboarding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Anna Kitou", email = "a.kitou@codehub.gr"}
]
keywords = ["rag", "mcp", "codebase", "ai", "llm", "embeddings"]

dependencies = [
    # FastAPI & Web
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",

    # Vector DB & Embeddings
    "chromadb==0.4.15",
    "anthropic==0.7.8",

    # Code Analysis
    "tree-sitter==0.20.4",
    "tree-sitter-languages==1.10.2",

    # MCP (Model Context Protocol)
    "mcp==0.1.8",

    # GitHub API
    "PyGithub==2.1.1",

    # Frontend
    "gradio==4.26.0",

    # Data/Config
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",

    # Utils
    "httpx==0.25.2",
    "aiofiles==23.2.1",

    # Logging
    "python-json-logger==2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "mypy==1.7.1",
    "ruff==0.1.8",
    "black==23.12.0",
    "isort==5.13.2",
]

eval = [
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scikit-learn==1.3.2",
    "matplotlib==3.8.2",
]

[tool.uv]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
